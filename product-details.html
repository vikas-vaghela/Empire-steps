<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Empire Steps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: #ffffff;
            color: #333333;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 20px;
            box-sizing: border-box;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #000;
            font-weight: 600;
        }

        /* Scrollable Image Gallery Section */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .main-img-box img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        /* Horizontal Scrollable Thumbnails - Fixed for Mobile Sliding */
        .thumbnails {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
            width: 100%;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .thumbnails::-webkit-scrollbar {
            height: 6px;
        }

        .thumbnails::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .thumbnails img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ddd;
            cursor: pointer;
            flex: 0 0 auto;
            transition: 0.2s;
        }

        .thumbnails img:hover, .thumbnails img.active-thumb {
            border-color: #000;
        }

        /* Product Info Section */
        .product-info {
            width: 100%;
            box-sizing: border-box;
        }

        .product-info h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #000;
        }

        .price-box {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-price {
            font-size: 22px;
            font-weight: 700;
            color: #000;
        }

        .orig-price {
            font-size: 16px;
            text-decoration: line-through;
            color: #888;
        }

        .discount-badge {
            background: #000;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: 600;
        }

        .section-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        /* Sizes & Colors */
        .sizes-list, .colors-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .size-btn, .color-btn {
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .size-btn.selected, .color-btn.selected {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .cart-btn, .buy-now-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-size: 15px;
            transition: 0.2s;
        }

        .cart-btn {
            background: #fff;
            color: #000;
            border: 1px solid #000;
        }

        .cart-btn:hover {
            background: #f1f1f1;
        }

        .buy-now-btn {
            background: #000;
            color: #fff;
            border: none;
        }

        .buy-now-btn:hover {
            background: #333;
        }

        .product-details-desc {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* Mobile Responsive Fixes */
        @media(max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 5px;
                margin: 10px auto;
            }
            .main-img-box img {
                height: 320px;
            }
            .thumbnails img {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>
<body>

<div style="max-width: 1100px; margin: 0 auto; padding: 0 10px;">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Store</a>
</div>

<div class="container" id="product-details-container">
    <p style="grid-column: 1 / -1; text-align: center;">Loading product details...</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "APKA_API_KEY_YAHAN_DALO",
        authDomain: "empire-steps-admin.firebaseapp.com",
        projectId: "empire-steps-admin",
        storageBucket: "empire-steps-admin.appspot.com",
        messagingSenderId: "144163770097",
        appId: "APKA_APP_ID_YAHAN_DALO"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchProductDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const container = document.getElementById('product-details-container');

        if (!productId) {
            container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: red;'>Product ID nahi mili!</p>";
            return;
        }

        try {
            const docRef = doc(db, "products", productId);
            const docSnap = await getDoc(docRef);

            if (!docSnap.exists()) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: red;'>Product database mein nahi mila!</p>";
                return;
            }

            const p = docSnap.data();
            
            let images = [];
            if (p.allImages && p.allImages.length > 0) {
                images = p.allImages;
            } else if (p.image) {
                images = [p.image];
            } else {
                images = ["https://images.unsplash.com/photo-1542291026-7eec264c27ff"];
            }
            
            let mainImage = images[0];

            let sizesHTML = "";
            if (p.sizes && p.sizes.length > 0) {
                sizesHTML = `<div class="section-title">Select Size:</div><div class="sizes-list">`;
                p.sizes.forEach((sz, idx) => {
                    sizesHTML += `<button class="size-btn ${idx === 0 ? 'selected' : ''}" onclick="selectSize(this)">${sz}</button>`;
                });
                sizesHTML += `</div>`;
            }

            let colorsHTML = "";
            if (p.colors) {
                colorsHTML = `<div class="section-title">Select Color:</div><div class="colors-list">`;
                let colorArray = p.colors.split(',');
                colorArray.forEach((col, idx) => {
                    colorsHTML += `<button class="color-btn ${idx === 0 ? 'selected' : ''}" onclick="selectColor(this)">${col.trim()}</button>`;
                });
                colorsHTML += `</div>`;
            }

            let thumbsHTML = `<div class="thumbnails">`;
            images.forEach((img, idx) => {
                thumbsHTML += `<img src="${img}" class="${idx === 0 ? 'active-thumb' : ''}" alt="Thumbnail" onclick="changeMainImage('${img}', this)">`;
            });
            thumbsHTML += `</div>`;

            container.innerHTML = `
                <div class="image-gallery">
                    <div class="main-img-box">
                        <img id="main-product-img" src="${mainImage}" alt="${p.name}">
                    </div>
                    ${thumbsHTML}
                </div>

                <div class="product-info">
                    <h1>${p.name}</h1>
                    <div class="price-box">
                        <span class="current-price">₹${p.price}</span>
                        ${p.originalPrice ? `<span class="orig-price">₹${p.originalPrice}</span>` : ''}
                        ${p.discount ? `<span class="discount-badge">${p.discount}</span>` : ''}
                    </div>

                    ${sizesHTML}
                    ${colorsHTML}

                    <div class="action-buttons">
                        <button class="cart-btn" onclick="addToCart()">Add to Cart</button>
                        <button class="buy-now-btn" onclick="buyNow()">Buy Now</button>
                    </div>

                    <div class="product-details-desc">
                        <strong>Product Details:</strong><br>
                        ${p.material ? p.material : '100% genuine comfort sole material, lightweight design, premium finish crafted specially for daily wear.'}
                    </div>
                </div>
            `;

        } catch (error) {
            console.error("Error fetching product details:", error);
            container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color:red;'>Data load karne mein error aaya.</p>";
        }
    }

    window.changeMainImage = function(src, thumbElement) {
        document.getElementById('main-product-img').src = src;
        document.querySelectorAll('.thumbnails img').forEach(img => img.classList.remove('active-thumb'));
        thumbElement.classList.add('active-thumb');
    }

    window.selectSize = function(btn) {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    window.selectColor = function(btn) {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    window.addToCart = function() {
        alert("Product successfully cart mein add ho gaya hai!");
    }

    window.buyNow = function() {
        alert("Redirecting to checkout...");
    }

    fetchProductDetails();
</script>

</body>
</html>
