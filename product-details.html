<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product Details - Empire Steps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
*{box-sizing:border-box}
body{background:#fff;color:#333;font-family:'Poppins',sans-serif;margin:0;padding:20px}
.container{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:20px}
.back-link{display:inline-block;margin-bottom:20px;text-decoration:none;color:#000;font-weight:600}

.image-gallery{display:flex;flex-direction:column;gap:15px}
.main-img-box{position:relative;width:100%;height:420px;border-radius:12px;overflow:hidden;border:1px solid #ddd;background:#fff;touch-action:pan-y;user-select:none}
.main-img-box img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.main-img-btn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.main-img-left{left:12px}.main-img-right{right:12px}

.thumbnails{display:flex;gap:12px;overflow-x:auto;padding:5px}
.thumbnails img{width:75px;height:75px;min-width:75px;object-fit:cover;border-radius:8px;border:2px solid #ddd;cursor:pointer}
.thumbnails img.active-thumb{border-color:#000;border-width:3px}

.product-info h1{font-size:26px;margin:0 0 10px;color:#000}
.price-box{margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.current-price{font-size:22px;font-weight:700;color:#000}
.orig-price{font-size:16px;text-decoration:line-through;color:#888}
.discount-badge{background:#000;color:#fff;padding:5px 9px;font-size:12px;border-radius:4px;font-weight:600}

.section-title{font-weight:600;font-size:14px;margin:20px 0 8px}
.sizes-list,.colors-list{display:flex;gap:10px;flex-wrap:wrap}
.size-btn,.color-btn{padding:8px 16px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
.size-btn.selected,.color-btn.selected{background:#000;color:#fff;border-color:#000}

.qty-box{display:flex;align-items:center;gap:12px}
.qty-btn{width:38px;height:38px;border:1px solid #000;background:#fff;border-radius:6px;font-size:20px;cursor:pointer}
.qty-value{width:45px;text-align:center;font-size:18px;font-weight:600}

.action-buttons{display:flex;gap:15px;margin-top:30px}
.cart-btn,.buy-now-btn{flex:1;padding:12px;border-radius:8px;font-weight:700;cursor:pointer}
.cart-btn{background:#fff;color:#000;border:1px solid #000}
.buy-now-btn{background:#000;color:#fff;border:0}

.share-product-btn{width:100%;margin-top:12px;padding:13px;border:1px solid #000;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}
.share-product-btn:hover{background:#000;color:#fff}

.return-policy{margin-top:16px;padding:12px 14px;border:1px solid #e5e5e5;border-radius:8px;background:#fafafa;font-size:13px;line-height:1.5}
.return-policy i{margin-right:7px}

.product-details-desc{margin-top:30px;font-size:14px;color:#666;line-height:1.7;border-top:1px solid #eee;padding-top:15px}

.related-products{grid-column:1/-1;margin-top:20px;border-top:1px solid #eee;padding-top:30px}
.related-title{font-size:22px;margin:0 0 20px}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.related-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;cursor:pointer}
.related-image{height:190px}
.related-image img{width:100%;height:100%;object-fit:cover}
.related-info{padding:12px}
.related-name{margin:0 0 8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related-price{font-weight:700}
.related-original{font-size:12px;color:#888;text-decoration:line-through;margin-left:6px}

.share-popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;align-items:center;justify-content:center;padding:20px}
.share-box{width:100%;max-width:500px;background:#fff;border-radius:14px;padding:22px}
.share-text{width:100%;height:330px;resize:none;padding:14px;border:1px solid #ddd;border-radius:8px;font-size:14px;line-height:1.5}
.share-actions{display:flex;gap:10px;margin-top:12px}
.share-actions button{flex:1;padding:12px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.copy-share-btn{background:#eee}
.whatsapp-share-btn{background:#25D366;color:#fff}
.close-share-btn{width:100%;margin-top:10px;padding:11px;border:1px solid #ddd;background:#fff;border-radius:8px}

@media(max-width:768px){
body{padding:10px}
.container{grid-template-columns:1fr;gap:20px;padding:5px}
.main-img-box{height:320px}
.thumbnails img{width:65px;height:65px;min-width:65px}
.related-grid{grid-template-columns:repeat(2,1fr);gap:12px}
.related-image{height:150px}
}

@media(max-width:400px){
.main-img-box{height:280px}
.action-buttons{flex-direction:column}
.related-grid{grid-template-columns:repeat(2,1fr);gap:10px}
.related-image{height:135px}
.share-actions{flex-direction:column}
}
</style>
</head>

<body>

<div style="max-width:1100px;margin:auto">
<a href="index.html" class="back-link">
<i class="fas fa-arrow-left"></i> Back to Store
</a>
</div>

<div class="container" id="product-details-container">
<p style="grid-column:1/-1;text-align:center">
Loading product details...
</p>
</div>

<div class="share-popup" id="share-popup" onclick="closeShareOutside(event)">
<div class="share-box">
<h2>📤 Share Product</h2>

<textarea class="share-text" id="share-text" readonly></textarea>

<div class="share-actions">
<button class="copy-share-btn" onclick="copyShareText()" type="button">
<i class="fas fa-copy"></i> Copy Text
</button>

<button class="whatsapp-share-btn" onclick="shareToWhatsApp()" type="button">
<i class="fab fa-whatsapp"></i> WhatsApp
</button>
</div>

<button class="close-share-btn" onclick="closeShareProduct()" type="button">
Close
</button>
</div>
</div>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import{
getFirestore,
doc,
getDoc,
collection,
getDocs
}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"APKA_API_KEY_YAHAN_DALO",
authDomain:"empire-steps-admin.firebaseapp.com",
projectId:"empire-steps-admin",
storageBucket:"empire-steps-admin.appspot.com",
messagingSenderId:"144163770097",
appId:"APKA_APP_ID_YAHAN_DALO"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let productImages=[];
let currentImageIndex=0;
let currentProductData={};
let quantity=1;
let touchStartX=0;
let mouseStartX=0;
let mouseDragging=false;


async function fetchProductDetails(){

const productId=new URLSearchParams(location.search).get("id");
const container=document.getElementById("product-details-container");

if(!productId){
container.innerHTML='<p style="grid-column:1/-1;text-align:center;color:red">Product ID nahi mili!</p>';
return;
}

try{

const snap=await getDoc(doc(db,"products",productId));

if(!snap.exists()){
container.innerHTML='<p style="grid-column:1/-1;text-align:center;color:red">Product database mein nahi mila!</p>';
return;
}

const p=snap.data();
currentProductData=p;

if(Array.isArray(p.allImages)&&p.allImages.length)
productImages=p.allImages.filter(Boolean);
else if(p.image)
productImages=[p.image];
else
productImages=["https://images.unsplash.com/photo-1542291026-7eec264c27ff"];

currentImageIndex=0;
quantity=1;


let sizesHTML="";

if(p.sizes&&p.sizes.length){

sizesHTML=`
<div class="section-title">Select Size:</div>
<div class="sizes-list">
${p.sizes.map((size,i)=>`
<button class="size-btn ${i===0?"selected":""}" onclick="selectSize(this)" type="button">${size}</button>
`).join("")}
</div>`;

}


let colorsHTML="";

if(p.colors){

const colors=String(p.colors).split(",");

colorsHTML=`
<div class="section-title">Select Color:</div>
<div class="colors-list">
${colors.map((color,i)=>`
<button class="color-btn ${i===0?"selected":""}" onclick="selectColor(this)" type="button">${color.trim()}</button>
`).join("")}
</div>`;

}


const thumbnails=productImages.map((image,i)=>`
<img
src="${image}"
class="${i===0?"active-thumb":""}"
data-index="${i}"
onclick="changeMainImage(${i})">
`).join("");


let discountHTML="";

if(p.discount){

const discount=String(p.discount).replace("%","").trim();

discountHTML=`<span class="discount-badge">${discount}% OFF</span>`;

}


const description=
p.description||
p.details||
p.material||
"Premium quality footwear with comfortable sole, lightweight design and stylish finish.";


container.innerHTML=`

<div class="image-gallery">

<div class="main-img-box" id="main-image-box">

<img
id="main-product-img"
src="${productImages[0]}"
alt="${p.name||"Product"}">

<button
class="main-img-btn main-img-left"
onclick="previousImage()"
type="button">
<i class="fas fa-chevron-left"></i>
</button>

<button
class="main-img-btn main-img-right"
onclick="nextImage()"
type="button">
<i class="fas fa-chevron-right"></i>
</button>

</div>

<div class="thumbnails">
${thumbnails}
</div>

</div>


<div class="product-info">

<h1>${p.name||"Product"}</h1>

<div class="price-box">

<span class="current-price">
₹${p.price||0}
</span>

${p.originalPrice?
`<span class="orig-price">₹${p.originalPrice}</span>`:""}

${discountHTML}

</div>

${sizesHTML}
${colorsHTML}

<div class="section-title">Quantity:</div>

<div class="qty-box">

<button
class="qty-btn"
onclick="changeQuantity(-1)"
type="button">−</button>

<span class="qty-value" id="quantity-value">1</span>

<button
class="qty-btn"
onclick="changeQuantity(1)"
type="button">+</button>

</div>

<div class="action-buttons">

<button
class="cart-btn"
onclick="addToCart()"
type="button">
Add to Cart
</button>

<button
class="buy-now-btn"
onclick="buyNow()"
type="button">
Buy Now
</button>

</div>

<button
class="share-product-btn"
onclick="openShareProduct()"
type="button">
<i class="fas fa-share-nodes"></i>
Share Product
</button>

<div class="return-policy">
<i class="fas fa-rotate-left"></i>
<strong>3 Day Return Policy</strong><br>
Easy returns available within 3 days of delivery.
</div>

<div class="product-details-desc">
<strong>Product Details:</strong><br>
${description}

${p.material?
`<br><br><strong>Material:</strong> ${p.material}`:""}

${p.category?
`<br><br><strong>Category:</strong> ${p.category}`:""}

${p.brand?
`<br><br><strong>Brand:</strong> ${p.brand}`:""}

</div>

</div>


<div class="related-products">

<h2 class="related-title">
Related Products
</h2>

<div
class="related-grid"
id="related-products-grid">
<p>Loading...</p>
</div>

</div>
`;

setupImageSwipe();
loadRelatedProducts(productId);

}catch(error){

console.error(error);

container.innerHTML=
'<p style="grid-column:1/-1;text-align:center;color:red">Data load karne mein error aaya.</p>';

}

}


window.changeMainImage=function(index){

if(index<0||index>=productImages.length)return;

currentImageIndex=index;

const img=document.getElementById("main-product-img");

if(!img)return;

img.style.opacity=".3";

setTimeout(()=>{

img.src=productImages[currentImageIndex];
img.style.opacity="1";

},100);

document.querySelectorAll(".thumbnails img").forEach((el,i)=>{
el.classList.toggle("active-thumb",i===currentImageIndex);
});

const active=document.querySelector(
`.thumbnails img[data-index="${currentImageIndex}"]`
);

if(active)
active.scrollIntoView({
behavior:"smooth",
block:"nearest",
inline:"center"
});

};


window.nextImage=function(){

if(productImages.length<=1)return;

let index=currentImageIndex+1;

if(index>=productImages.length)
index=0;

changeMainImage(index);

};


window.previousImage=function(){

if(productImages.length<=1)return;

let index=currentImageIndex-1;

if(index<0)
index=productImages.length-1;

changeMainImage(index);

};


window.changeQuantity=function(change){

quantity+=change;

if(quantity<1)
quantity=1;

const el=document.getElementById("quantity-value");

if(el)
el.textContent=quantity;

};


window.selectSize=function(button){

document.querySelectorAll(".size-btn")
.forEach(el=>el.classList.remove("selected"));

button.classList.add("selected");

};


window.selectColor=function(button){

document.querySelectorAll(".color-btn")
.forEach(el=>el.classList.remove("selected"));

button.classList.add("selected");

};


function setupImageSwipe(){

const gallery=document.getElementById("main-image-box");

if(!gallery)return;


gallery.addEventListener("touchstart",e=>{

if(e.touches.length===1)
touchStartX=e.touches[0].clientX;

},{passive:true});


gallery.addEventListener("touchend",e=>{

if(!e.changedTouches.length)return;

const distance=
touchStartX-e.changedTouches[0].clientX;

if(Math.abs(distance)<45)return;

distance>0?nextImage():previousImage();

},{passive:true});


gallery.addEventListener("mousedown",e=>{

if(e.target.closest(".main-img-btn"))
return;

mouseDragging=true;
mouseStartX=e.clientX;

});


gallery.addEventListener("mouseup",e=>{

if(!mouseDragging)return;

mouseDragging=false;

const distance=
mouseStartX-e.clientX;

if(Math.abs(distance)<50)return;

distance>0?nextImage():previousImage();

});


gallery.addEventListener("mouseleave",()=>{
mouseDragging=false;
});

}


document.addEventListener("keydown",e=>{

if(["INPUT","TEXTAREA","SELECT"]
.includes(document.activeElement.tagName))
return;

if(e.key==="ArrowRight")
nextImage();

if(e.key==="ArrowLeft")
previousImage();

});


function getSelectedOptions(){

const size=document.querySelector(".size-btn.selected");
const color=document.querySelector(".color-btn.selected");

return{
size:size?size.innerText.trim():"Standard",
color:color?color.innerText.trim():"Default"
};

}


window.addToCart=function(){

let cart=
JSON.parse(localStorage.getItem("myCart"))||[];

const name=currentProductData.name||"Product";
const price=Number(currentProductData.price||0);
const image=productImages[currentImageIndex]||productImages[0];
const options=getSelectedOptions();

const itemName=
`${name} (${options.size}, ${options.color})`;

const existing=cart.find(
item=>item.name===itemName
);

if(existing){

existing.qty+=quantity;
existing.image=image;

}else{

cart.push({
name:itemName,
price:price,
qty:quantity,
size:options.size,
color:options.color,
image:image
});

}

localStorage.setItem(
"myCart",
JSON.stringify(cart)
);

alert("Product successfully cart mein add ho gaya hai!");

};


window.buyNow=function(){

const name=currentProductData.name||"Product";
const price=Number(currentProductData.price||0);
const image=productImages[currentImageIndex]||productImages[0];
const options=getSelectedOptions();

localStorage.setItem(
"myCart",
JSON.stringify([{
name:`${name} (${options.size}, ${options.color})`,
price:price,
qty:quantity,
size:options.size,
color:options.color,
image:image
}])
);

location.href="checkout.html";

};


async function loadRelatedProducts(currentId){

const grid=document.getElementById(
"related-products-grid"
);

if(!grid)return;

try{

const snapshot=
await getDocs(collection(db,"products"));

let products=[];

snapshot.forEach(item=>{

if(item.id!==currentId){

products.push({
id:item.id,
...item.data()
});

}

});


const brand=
String(currentProductData.brand||"")
.trim().toLowerCase();

const name=
String(currentProductData.name||"")
.trim().toLowerCase();

const category=
String(currentProductData.category||"")
.trim().toLowerCase();


let brandProducts=[];
let nameProducts=[];
let categoryProducts=[];
let otherProducts=[];


products.forEach(product=>{

const pBrand=
String(product.brand||"")
.trim().toLowerCase();

const pName=
String(product.name||"")
.trim().toLowerCase();

const pCategory=
String(product.category||"")
.trim().toLowerCase();


if(brand&&pBrand===brand)
brandProducts.push(product);

else if(name&&(
pName.includes(name)||
name.includes(pName)
))
nameProducts.push(product);

else if(category&&pCategory===category)
categoryProducts.push(product);

else
otherProducts.push(product);

});


products=[
...brandProducts,
...nameProducts,
...categoryProducts,
...otherProducts
].slice(0,8);


if(!products.length){

grid.innerHTML=
"<p>No related products found.</p>";

return;

}


grid.innerHTML=products.map(product=>{

const image=
product.image||
(
product.allImages&&product.allImages.length
?product.allImages[0]
:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"
);


return`

<div
class="related-card"
onclick="openRelatedProduct('${product.id}')">

<div class="related-image">
<img
src="${image}"
alt="${product.name||"Product"}">
</div>

<div class="related-info">

<h3 class="related-name">
${product.name||"Product"}
</h3>

<span class="related-price">
₹${product.price||0}
</span>

${product.originalPrice?
`<span class="related-original">
₹${product.originalPrice}
</span>`:""}

</div>

</div>

`;

}).join("");

}catch(error){

console.error(error);

grid.innerHTML=
"<p>Related products load nahi ho paaye.</p>";

}

}


window.openRelatedProduct=function(id){

location.href=
"product-details.html?id="+id;

};


window.openShareProduct=function(){

const p=currentProductData;

const name=p.name||"Product";

let sizes="Available Sizes";

if(Array.isArray(p.sizes)&&p.sizes.length)
sizes=p.sizes.join(",");

const price=p.price||0;

const productUrl=window.location.href;

const orderUrl=
"https://empireshoes.in/";

const message=
`MODEL :- ${name}

(With Original Box)

Sizes: ${sizes}

Quality:- Premium Quality Guaranteed✔️

Price : ${price}/- Rate

Shipping Extra

Returns Accepted 💯

Place Orders On Below Link👇🏻:

${orderUrl}

Product Direct Link🔥

${productUrl}`;

document.getElementById("share-text").value=message;

document.getElementById("share-popup").style.display="flex";

};


window.closeShareProduct=function(){

document.getElementById("share-popup").style.display="none";

};


window.closeShareOutside=function(e){

if(e.target.id==="share-popup")
closeShareProduct();

};


window.copyShareText=async function(){

const textarea=
document.getElementById("share-text");

const text=textarea.value;

try{

await navigator.clipboard.writeText(text);

alert("Copied! ✅");

}catch(error){

textarea.removeAttribute("readonly");
textarea.select();

document.execCommand("copy");

textarea.setAttribute("readonly","readonly");

alert("Copied! ✅");

}

};


window.shareToWhatsApp=function(){

const text=
document.getElementById("share-text").value;

window.open(
"https://wa.me/?text="+encodeURIComponent(text),
"_blank"
);

};


fetchProductDetails();

</script>
</body>
</html>
