<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details - Empire Steps</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    background: #ffffff;
    color: #333333;
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 20px;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    max-width: 1100px;
    margin: 20px auto;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 40px;

    padding: 20px;
}


/* =========================
   BACK BUTTON
========================= */

.back-link {
    display: inline-block;

    margin-bottom: 20px;

    text-decoration: none;

    color: #000;

    font-weight: 600;
}


/* =========================
   IMAGE GALLERY
========================= */

.image-gallery {
    display: flex;

    flex-direction: column;

    gap: 15px;

    width: 100%;

    min-width: 0;
}


/* =========================
   MAIN IMAGE
========================= */

.main-img-box {
    position: relative;

    width: 100%;

    height: 420px;

    border-radius: 12px;

    overflow: hidden;

    border: 1px solid #ddd;

    background: #fff;

    touch-action: pan-y;

    user-select: none;
}


.main-img-box img {
    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition: opacity 0.2s ease;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================
   MAIN IMAGE BUTTONS
========================= */

.main-img-btn {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: rgba(0, 0, 0, 0.75);

    color: #fff;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    z-index: 5;

    transition: 0.2s;
}


.main-img-btn:hover {
    background: #000;
}


.main-img-left {
    left: 12px;
}


.main-img-right {
    right: 12px;
}


/* =========================
   THUMBNAILS
========================= */

.thumbnails-wrapper {
    width: 100%;

    overflow: hidden;

    position: relative;

    padding: 5px 0;
}


.thumbnails {
    display: flex;

    flex-direction: row;

    flex-wrap: nowrap;

    gap: 12px;

    overflow-x: auto;

    overflow-y: hidden;

    -webkit-overflow-scrolling: touch;

    scroll-behavior: smooth;

    touch-action: pan-x;

    width: 100%;

    padding: 2px 4px;

    scrollbar-width: thin;
}


.thumbnails::-webkit-scrollbar {
    height: 7px;
}


.thumbnails::-webkit-scrollbar-thumb {
    background: #555;

    border-radius: 4px;
}


.thumbnails img {
    width: 75px;

    height: 75px;

    min-width: 75px;

    object-fit: cover;

    border-radius: 8px;

    border: 2px solid #ddd;

    cursor: pointer;

    flex: 0 0 auto;

    transition: 0.2s;

    user-select: none;

    -webkit-user-drag: none;
}


.thumbnails img.active-thumb {
    border-color: #000;

    border-width: 3px;
}


/* =========================
   PRODUCT INFO
========================= */

.product-info {
    width: 100%;

    min-width: 0;
}


.product-info h1 {
    font-size: 26px;

    margin-top: 0;

    margin-bottom: 10px;

    color: #000;
}


/* =========================
   PRICE
========================= */

.price-box {
    margin-bottom: 20px;

    display: flex;

    align-items: center;

    gap: 12px;

    flex-wrap: wrap;
}


.current-price {
    font-size: 22px;

    font-weight: 700;

    color: #000;
}


.orig-price {
    font-size: 16px;

    text-decoration: line-through;

    color: #888;
}


.discount-badge {
    background: #000;

    color: #fff;

    padding: 5px 9px;

    font-size: 12px;

    border-radius: 4px;

    font-weight: 600;
}


/* =========================
   SECTION TITLE
========================= */

.section-title {
    font-weight: 600;

    font-size: 14px;

    margin-bottom: 8px;

    margin-top: 20px;
}


/* =========================
   SIZE / COLOR
========================= */

.sizes-list,
.colors-list {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


.size-btn,
.color-btn {
    padding: 8px 16px;

    border: 1px solid #ccc;

    border-radius: 6px;

    background: #fff;

    cursor: pointer;

    font-weight: 500;

    transition: 0.2s;
}


.size-btn:hover,
.color-btn:hover {
    border-color: #000;
}


.size-btn.selected,
.color-btn.selected {
    background: #000;

    color: #fff;

    border-color: #000;
}


/* =========================
   QUANTITY
========================= */

.qty-box {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-top: 5px;
}


.qty-btn {
    width: 38px;

    height: 38px;

    border: 1px solid #000;

    background: #fff;

    color: #000;

    border-radius: 6px;

    font-size: 20px;

    font-weight: 600;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: 0.2s;
}


.qty-btn:hover {
    background: #000;

    color: #fff;
}


.qty-value {
    width: 45px;

    text-align: center;

    font-size: 18px;

    font-weight: 600;

    color: #000;
}


/* =========================
   ACTION BUTTONS
========================= */

.action-buttons {
    display: flex;

    gap: 15px;

    margin-top: 30px;
}


.cart-btn,
.buy-now-btn {
    flex: 1;

    padding: 12px;

    border-radius: 8px;

    font-weight: 700;

    cursor: pointer;

    text-align: center;

    font-size: 15px;

    transition: 0.2s;
}


.cart-btn {
    background: #fff;

    color: #000;

    border: 1px solid #000;
}


.cart-btn:hover {
    background: #f1f1f1;
}


.buy-now-btn {
    background: #000;

    color: #fff;

    border: none;
}


.buy-now-btn:hover {
    background: #333;
}


/* =========================
   PRODUCT DETAILS
========================= */

.product-details-desc {
    margin-top: 30px;

    font-size: 14px;

    color: #666;

    line-height: 1.7;

    border-top: 1px solid #eee;

    padding-top: 15px;
}


.product-details-desc strong {
    color: #222;
}


/* =========================
   RELATED PRODUCTS
========================= */

.related-products {
    grid-column: 1 / -1;

    margin-top: 20px;

    border-top: 1px solid #eee;

    padding-top: 30px;
}


.related-title {
    font-size: 22px;

    color: #111;

    margin: 0 0 20px 0;
}


.related-grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 20px;
}


/* =========================
   RELATED CARD
========================= */

.related-card {
    background: #fff;

    border: 1px solid #e5e5e5;

    border-radius: 10px;

    overflow: hidden;

    cursor: pointer;

    transition: 0.25s;
}


.related-card:hover {
    transform: translateY(-4px);

    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
}


.related-image {
    width: 100%;

    height: 190px;

    background: #fff;

    overflow: hidden;
}


.related-image img {
    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


.related-info {
    padding: 12px;
}


.related-name {
    margin: 0 0 8px 0;

    font-size: 15px;

    color: #222;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.related-price {
    font-size: 16px;

    font-weight: 700;

    color: #000;
}


.related-original {
    font-size: 12px;

    color: #888;

    text-decoration: line-through;

    margin-left: 6px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    body {
        padding: 10px;
    }


    .container {
        grid-template-columns: 1fr;

        gap: 20px;

        padding: 5px;

        margin: 10px auto;
    }


    .main-img-box {
        height: 320px;
    }


    .main-img-btn {
        width: 38px;

        height: 38px;
    }


    .main-img-left {
        left: 8px;
    }


    .main-img-right {
        right: 8px;
    }


    .thumbnails img {
        width: 65px;

        height: 65px;

        min-width: 65px;
    }


    .related-products {
        margin-top: 10px;
    }


    .related-grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 12px;
    }


    .related-image {
        height: 150px;
    }
}


/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 400px) {

    .main-img-box {
        height: 280px;
    }


    .action-buttons {
        flex-direction: column;
    }


    .related-grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
    }


    .related-image {
        height: 135px;
    }


    .related-info {
        padding: 9px;
    }


    .related-name {
        font-size: 13px;
    }
}

</style>

</head>


<body>


<div style="max-width:1100px;margin:0 auto;padding:0 10px;">

    <a href="index.html" class="back-link">

        <i class="fas fa-arrow-left"></i>

        Back to Store

    </a>

</div>


<div class="container" id="product-details-container">

    <p style="grid-column:1/-1;text-align:center;">

        Loading product details...

    </p>

</div>


<script type="module">


/* =========================
   FIREBASE IMPORT
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "APKA_API_KEY_YAHAN_DALO",

    authDomain: "empire-steps-admin.firebaseapp.com",

    projectId: "empire-steps-admin",

    storageBucket: "empire-steps-admin.appspot.com",

    messagingSenderId: "144163770097",

    appId: "APKA_APP_ID_YAHAN_DALO"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   GLOBAL VARIABLES
========================= */

let productImages = [];

let currentImageIndex = 0;

let currentProductData = {};

let quantity = 1;

let touchStartX = 0;

let mouseStartX = 0;

let mouseDragging = false;


/* =========================
   FETCH PRODUCT
========================= */

async function fetchProductDetails() {

    const urlParams =
        new URLSearchParams(window.location.search);


    const productId =
        urlParams.get("id");


    const container =
        document.getElementById(
            "product-details-container"
        );


    if (!productId) {

        container.innerHTML = `
            <p style="grid-column:1/-1;text-align:center;color:red;">
                Product ID nahi mili!
            </p>
        `;

        return;
    }


    try {

        const docRef =
            doc(db, "products", productId);


        const docSnap =
            await getDoc(docRef);


        if (!docSnap.exists()) {

            container.innerHTML = `
                <p style="grid-column:1/-1;text-align:center;color:red;">
                    Product database mein nahi mila!
                </p>
            `;

            return;
        }


        const p =
            docSnap.data();


        currentProductData = p;


        /* =========================
           PRODUCT IMAGES
        ========================= */

        if (
            p.allImages &&
            Array.isArray(p.allImages) &&
            p.allImages.length > 0
        ) {

            productImages =
                p.allImages.filter(Boolean);

        }

        else if (p.image) {

            productImages = [
                p.image
            ];

        }

        else {

            productImages = [
                "https://images.unsplash.com/photo-1542291026-7eec264c27ff"
            ];

        }


        currentImageIndex = 0;

        quantity = 1;


        /* =========================
           SIZE HTML
        ========================= */

        let sizesHTML = "";


        if (
            p.sizes &&
            p.sizes.length > 0
        ) {

            sizesHTML = `

                <div class="section-title">
                    Select Size:
                </div>

                <div class="sizes-list">

            `;


            p.sizes.forEach((size, index) => {

                sizesHTML += `

                    <button
                        class="size-btn ${index === 0 ? "selected" : ""}"
                        onclick="selectSize(this)"
                        type="button">

                        ${size}

                    </button>

                `;

            });


            sizesHTML += `

                </div>

            `;

        }


        /* =========================
           COLOR HTML
        ========================= */

        let colorsHTML = "";


        if (p.colors) {

            colorsHTML = `

                <div class="section-title">
                    Select Color:
                </div>

                <div class="colors-list">

            `;


            const colorArray =
                String(p.colors).split(",");


            colorArray.forEach((color, index) => {

                colorsHTML += `

                    <button
                        class="color-btn ${index === 0 ? "selected" : ""}"
                        onclick="selectColor(this)"
                        type="button">

                        ${color.trim()}

                    </button>

                `;

            });


            colorsHTML += `

                </div>

            `;

        }


        /* =========================
           THUMBNAILS
        ========================= */

        let thumbnailsHTML = "";


        productImages.forEach((image, index) => {

            thumbnailsHTML += `

                <img
                    src="${image}"
                    class="${index === 0 ? "active-thumb" : ""}"
                    data-index="${index}"
                    alt="Product Image"
                    onclick="changeMainImage(${index})">

            `;

        });


        /* =========================
           DISCOUNT
        ========================= */

        let discountHTML = "";


        if (p.discount) {

            let discount =
                String(p.discount)
                .replace("%", "")
                .trim();


            discountHTML = `

                <span class="discount-badge">
                    ${discount}% OFF
                </span>

            `;

        }


        /* =========================
           PRODUCT DESCRIPTION
        ========================= */

        let description =
            p.description ||
            p.details ||
            p.material ||
            "Premium quality footwear with comfortable sole, lightweight design and stylish finish.";


        /* =========================
           MAIN HTML
        ========================= */

        container.innerHTML = `

            <!-- IMAGE SECTION -->

            <div class="image-gallery">


                <div
                    class="main-img-box"
                    id="main-image-box">


                    <img
                        id="main-product-img"
                        src="${productImages[0]}"
                        alt="${p.name || "Product"}"
                        draggable="false">


                    <button
                        class="main-img-btn main-img-left"
                        onclick="previousImage()"
                        type="button">

                        <i class="fas fa-chevron-left"></i>

                    </button>


                    <button
                        class="main-img-btn main-img-right"
                        onclick="nextImage()"
                        type="button">

                        <i class="fas fa-chevron-right"></i>

                    </button>


                </div>


                <div class="thumbnails-wrapper">

                    <div
                        class="thumbnails"
                        id="thumbs-container">

                        ${thumbnailsHTML}

                    </div>

                </div>


            </div>


            <!-- PRODUCT INFO -->

            <div class="product-info">


                <h1>
                    ${p.name || "Product"}
                </h1>


                <div class="price-box">


                    <span class="current-price">
                        ₹${p.price || 0}
                    </span>


                    ${
                        p.originalPrice
                        ?
                        `
                        <span class="orig-price">
                            ₹${p.originalPrice}
                        </span>
                        `
                        :
                        ""
                    }


                    ${discountHTML}


                </div>


                ${sizesHTML}


                ${colorsHTML}


                <!-- QUANTITY -->

                <div class="section-title">
                    Quantity:
                </div>


                <div class="qty-box">


                    <button
                        class="qty-btn"
                        onclick="changeQuantity(-1)"
                        type="button">

                        −

                    </button>


                    <span
                        class="qty-value"
                        id="quantity-value">

                        1

                    </span>


                    <button
                        class="qty-btn"
                        onclick="changeQuantity(1)"
                        type="button">

                        +

                    </button>


                </div>


                <!-- ACTION BUTTONS -->

                <div class="action-buttons">


                    <button
                        class="cart-btn"
                        onclick="addToCart()"
                        type="button">

                        Add to Cart

                    </button>


                    <button
                        class="buy-now-btn"
                        onclick="buyNow()"
                        type="button">

                        Buy Now

                    </button>


                </div>


                <!-- DETAILS -->

                <div class="product-details-desc">


                    <strong>
                        Product Details:
                    </strong>


                    <br>


                    ${description}


                    ${
                        p.material
                        ?
                        `
                        <br><br>

                        <strong>
                            Material:
                        </strong>

                        ${p.material}
                        `
                        :
                        ""
                    }


                    ${
                        p.category
                        ?
                        `
                        <br><br>

                        <strong>
                            Category:
                        </strong>

                        ${p.category}
                        `
                        :
                        ""
                    }


                    ${
                        p.brand
                        ?
                        `
                        <br><br>

                        <strong>
                            Brand:
                        </strong>

                        ${p.brand}
                        `
                        :
                        ""
                    }


                </div>


            </div>


            <!-- RELATED PRODUCTS -->

            <div class="related-products">


                <h2 class="related-title">
                    Related Products
                </h2>


                <div
                    class="related-grid"
                    id="related-products-grid">

                    <p>
                        Loading...
                    </p>

                </div>


            </div>

        `;


        setupImageSwipe();


        loadRelatedProducts(productId);


    }

    catch (error) {

        console.error(
            "Product error:",
            error
        );


        container.innerHTML = `

            <p
                style="grid-column:1/-1;text-align:center;color:red;">

                Data load karne mein error aaya.

            </p>

        `;

    }

}


/* =========================
   CHANGE MAIN IMAGE
========================= */

window.changeMainImage = function(index) {


    if (
        index < 0 ||
        index >= productImages.length
    ) {

        return;

    }


    currentImageIndex = index;


    const mainImage =
        document.getElementById(
            "main-product-img"
        );


    if (!mainImage) {

        return;

    }


    mainImage.style.opacity = "0.3";


    setTimeout(() => {

        mainImage.src =
            productImages[currentImageIndex];


        mainImage.style.opacity = "1";

    }, 100);


    document
        .querySelectorAll(
            ".thumbnails img"
        )
        .forEach((image, imageIndex) => {

            image.classList.toggle(
                "active-thumb",
                imageIndex === currentImageIndex
            );

        });


    const activeThumbnail =
        document.querySelector(
            `.thumbnails img[data-index="${currentImageIndex}"]`
        );


    if (activeThumbnail) {

        activeThumbnail.scrollIntoView({

            behavior: "smooth",

            block: "nearest",

            inline: "center"

        });

    }

};


/* =========================
   NEXT IMAGE
========================= */

window.nextImage = function() {


    if (productImages.length <= 1) {

        return;

    }


    let nextIndex =
        currentImageIndex + 1;


    if (
        nextIndex >= productImages.length
    ) {

        nextIndex = 0;

    }


    changeMainImage(nextIndex);

};


/* =========================
   PREVIOUS IMAGE
========================= */

window.previousImage = function() {


    if (productImages.length <= 1) {

        return;

    }


    let previousIndex =
        currentImageIndex - 1;


    if (previousIndex < 0) {

        previousIndex =
            productImages.length - 1;

    }


    changeMainImage(previousIndex);

};


/* =========================
   QUANTITY
========================= */

window.changeQuantity = function(change) {


    quantity += change;


    if (quantity < 1) {

        quantity = 1;

    }


    const quantityElement =
        document.getElementById(
            "quantity-value"
        );


    if (quantityElement) {

        quantityElement.textContent =
            quantity;

    }

};


/* =========================
   SELECT SIZE
========================= */

window.selectSize = function(button) {


    document
        .querySelectorAll(".size-btn")
        .forEach(item => {

            item.classList.remove(
                "selected"
            );

        });


    button.classList.add(
        "selected"
    );

};


/* =========================
   SELECT COLOR
========================= */

window.selectColor = function(button) {


    document
        .querySelectorAll(".color-btn")
        .forEach(item => {

            item.classList.remove(
                "selected"
            );

        });


    button.classList.add(
        "selected"
    );

};


/* =========================
   IMAGE SWIPE
========================= */

function setupImageSwipe() {


    const gallery =
        document.getElementById(
            "main-image-box"
        );


    if (!gallery) {

        return;

    }


    /* MOBILE TOUCH */

    gallery.addEventListener(
        "touchstart",
        function(event) {

            if (
                !event.touches ||
                event.touches.length !== 1
            ) {

                return;

            }


            touchStartX =
                event.touches[0].clientX;

        },
        {
            passive: true
        }
    );


    gallery.addEventListener(
        "touchend",
        function(event) {


            if (
                !event.changedTouches ||
                event.changedTouches.length !== 1
            ) {

                return;

            }


            const touchEndX =
                event.changedTouches[0].clientX;


            const distance =
                touchStartX - touchEndX;


            if (
                Math.abs(distance) < 45
            ) {

                return;

            }


            if (distance > 0) {

                nextImage();

            }

            else {

                previousImage();

            }

        },
        {
            passive: true
        }
    );


    /* WINDOWS MOUSE DRAG */

    gallery.addEventListener(
        "mousedown",
        function(event) {


            if (
                event.target.closest(
                    ".main-img-btn"
                )
            ) {

                return;

            }


            mouseDragging = true;


            mouseStartX =
                event.clientX;


            gallery.style.cursor =
                "grabbing";

        }
    );


    gallery.addEventListener(
        "mouseup",
        function(event) {


            if (!mouseDragging) {

                return;

            }


            mouseDragging = false;


            gallery.style.cursor =
                "default";


            const distance =
                mouseStartX - event.clientX;


            if (
                Math.abs(distance) < 50
            ) {

                return;

            }


            if (distance > 0) {

                nextImage();

            }

            else {

                previousImage();

            }

        }
    );


    gallery.addEventListener(
        "mouseleave",
        function() {

            mouseDragging = false;

            gallery.style.cursor =
                "default";

        }
    );

}


/* =========================
   KEYBOARD NAVIGATION
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        const tag =
            document.activeElement.tagName;


        if (
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT"
        ) {

            return;

        }


        if (
            event.key === "ArrowRight"
        ) {

            nextImage();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousImage();

        }

    }
);


/* =========================
   ADD TO CART
========================= */

window.addToCart = function() {


    let cart =
        JSON.parse(
            localStorage.getItem(
                "myCart"
            )
        ) || [];


    const productName =
        currentProductData.name ||
        "Product";


    const price =
        Number(
            currentProductData.price || 0
        );


    const selectedSizeElement =
        document.querySelector(
            ".size-btn.selected"
        );


    const selectedColorElement =
        document.querySelector(
            ".color-btn.selected"
        );


    const selectedSize =
        selectedSizeElement
        ?
        selectedSizeElement.innerText.trim()
        :
        "Standard";


    const selectedColor =
        selectedColorElement
        ?
        selectedColorElement.innerText.trim()
        :
        "Default";


    let existingItem =
        cart.find(item =>

            item.name === productName &&

            item.size === selectedSize &&

            item.color === selectedColor

        );


    if (existingItem) {

        existingItem.qty += quantity;

    }

    else {

        cart.push({

            name: productName,

            price: price,

            qty: quantity,

            size: selectedSize,

            color: selectedColor

        });

    }


    localStorage.setItem(
        "myCart",
        JSON.stringify(cart)
    );


    alert(
        quantity +
        " product cart mein add ho gaya!"
    );

};


/* =========================
   BUY NOW
========================= */

window.buyNow = function() {


    addToCart();


    window.location.href =
        "checkout.html";

};


/* =========================
   RELATED PRODUCTS
========================= */

async function loadRelatedProducts(
    currentProductId
) {


    const relatedGrid =
        document.getElementById(
            "related-products-grid"
        );


    if (!relatedGrid) {

        return;

    }


    try {


        const productsSnapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );


        let products = [];


        productsSnapshot.forEach(
            productDoc => {


                if (
                    productDoc.id !==
                    currentProductId
                ) {


                    products.push({

                        id: productDoc.id,

                        ...productDoc.data()

                    });

                }

            }
        );


        /* =========================
           SAME CATEGORY FIRST
        ========================= */

        if (currentProductData.category) {


            const sameCategory =
                products.filter(
                    product =>
                        product.category &&
                        product.category ===
                        currentProductData.category
                );


            const otherProducts =
                products.filter(
                    product =>
                        !(
                            product.category &&
                            product.category ===
                            currentProductData.category
                        )
                );


            products =
                [
                    ...sameCategory,
                    ...otherProducts
                ];

        }


        /* SHOW MAX 8 */

        products =
            products.slice(0, 8);


        if (!products.length) {

            relatedGrid.innerHTML = `
                <p>
                    No related products found.
                </p>
            `;

            return;

        }


        let relatedHTML = "";


        products.forEach(product => {


            let image = "";


            if (
                product.image
            ) {

                image =
                    product.image;

            }

            else if (
                product.allImages &&
                product.allImages.length
            ) {

                image =
                    product.allImages[0];

            }

            else {

                image =
                    "https://images.unsplash.com/photo-1542291026-7eec264c27ff";

            }


            relatedHTML += `

                <div
                    class="related-card"
                    onclick="openRelatedProduct('${product.id}')">


                    <div class="related-image">

                        <img
                            src="${image}"
                            alt="${product.name || "Product"}">

                    </div>


                    <div class="related-info">


                        <h3 class="related-name">

                            ${product.name || "Product"}

                        </h3>


                        <span class="related-price">

                            ₹${product.price || 0}

                        </span>


                        ${
                            product.originalPrice
                            ?
                            `
                            <span class="related-original">

                                ₹${product.originalPrice}

                            </span>
                            `
                            :
                            ""
                        }


                    </div>


                </div>

            `;

        });


        relatedGrid.innerHTML =
            relatedHTML;


    }

    catch (error) {


        console.error(
            "Related products error:",
            error
        );


        relatedGrid.innerHTML = "";

    }

}
